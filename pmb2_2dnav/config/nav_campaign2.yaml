# ============================================================================
# Nav2 parameters for RCT campaign 2 (world pal_office_campaign2).
# Byte-for-byte the committed nav_public_sim.yaml at 6dd45ca (2026-09-15),
# i.e. the configuration campaign A2 ran with: TUCKED footprint on both
# costmaps (the collector's captured baseline), the no-recovery behaviour tree
# navigate_w_replanning_only.xml, PoseProgressChecker, speed_limit_topic
# /speed_limit, MPPI vx_max 0.7. Saved as its own file on 2026-11-12 because
# the working copy of nav_public_sim.yaml (modified 2026-10-22) uses the CARRY
# footprint, PAL's recovery tree and different MPPI/AMCL values; that working
# copy is left untouched. gazebo_with_navigation.launch.py loads this file
# automatically for world_name:=pal_office_campaign2 and, since 2026-11-17,
# for the causal_benchmark* worlds (override: nav_params:=).
# ============================================================================
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    base_frame_id: base_footprint
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: map
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 2000
    min_particles: 500
    odom_frame_id: odom
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    # CHANGED 1.0 -> 0.3. TF was being extrapolated up to a full second; at
    # 0.2 m/s that is 0.2 m of pose error injected into the goal checker.
    transform_tolerance: 0.3
    # CHANGED 0.2 -> 0.10 and 0.25 -> 0.10. AMCL only runs a filter update
    # after this much motion. The whole final approach covers about 0.5 m, so
    # at 0.25 m the filter updated roughly twice during the part of the
    # mission where pose accuracy decides success. Measured
    # localization_error_m was 0.27 against a 0.35 m gate.
    update_min_a: 0.10
    update_min_d: 0.10
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: /scan_raw
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: -8.5
      z: 0.0
      yaw: 1.5708

behavior_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
