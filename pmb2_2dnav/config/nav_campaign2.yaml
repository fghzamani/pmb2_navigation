    default_bt_xml_filename: "/home/forough/phd_projects/online_tuner/src/rct_data_collector/behavior_trees/navigate_w_replanning_only.xml"   #"navigate_w_replanning_and_recovery.xml"
    plugin_lib_names:
    - nav2_compute_path_to_pose_action_bt_node
